<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Panel · Vitali</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="admin.css">
</head>
<body>
<nav><div class="wrap">
 <b>Vitali · Panel</b>
 <div><span id="quien"></span><button class="btn w hide" id="salir">Salir</button></div>
</div></nav>

<main class="wrap" style="padding-top:40px;padding-bottom:80px">
 <p class="err hide" id="aviso"></p>

 <div class="panel login hide" id="loginBox">
  <h3>Ingresar</h3>
  <form id="login">
   <label for="email">Email</label><input id="email" name="email" type="email" required autocomplete="username">
   <label for="pass">Contraseña</label><input id="pass" name="pass" type="password" required autocomplete="current-password">
   <p class="err hide" id="lerr"></p>
   <button class="btn" style="margin-top:16px;width:100%">Ingresar</button>
  </form>
 </div>

 <div class="hide" id="panel">
  <h2>Turnos reservados</h2>
  <div class="filtros">
   <div><label for="fd">Desde</label><input type="date" id="fd"></div>
   <div><label for="fh">Hasta (vacío = sin límite)</label><input type="date" id="fh"></div>
   <div><label for="efil">Especialidad</label><select id="efil"></select></div>
   <div id="pbox"><label for="pfil">Profesional</label><select id="pfil"></select></div>
  </div>
  <div class="tabs" id="rapidos">
   <button data-r="prox">Próximos</button><button data-r="hoy">Hoy</button><button data-r="mes">Este mes</button><button data-r="30">Últimos 30 días</button><button data-r="todo">Todo el historial</button>
  </div>
  <div class="tabs" id="tabs">
   <button data-f="todos" class="on">Todos</button><button data-f="pendiente">Pendientes</button><button data-f="confirmado">Confirmados</button>
  </div>
  <div class="tot" id="tot"></div>
  <div id="lista"></div>
 </div>
</main>

<script src="config.js"></script>
<script src="admin.js"></script>
</body>
</html>
